name: Patch family lead time
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize two-hour pickup lead time
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('family.html')
          b = p.read_bytes()
          original = b
          b = b.replace(b'const LEAD_MINUTES=60;', b'const LEAD_MINUTES=120;')
          b = b.replace(b'1 hour', b'2 hours')
          b = b.replace('1 小時'.encode('utf-8'), '2 小時'.encode('utf-8'))
          b = b.replace(b"2 hours's notice", b"2 hours' notice")
          if b == original:
              raise SystemExit('No changes made')
          p.write_bytes(b)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html
          git commit -m "Finalize two-hour family pickup lead time"
          git push
