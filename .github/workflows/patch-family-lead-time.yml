name: Patch family lead time
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change pickup lead time to two hours
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('family.html')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('const LEAD_MINUTES=60;', 'const LEAD_MINUTES=120;')
          s = s.replace('1 hour', '2 hours')
          s = s.replace('1 小時', '2 小時')
          if s == original:
              raise SystemExit('No changes made')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html
          git commit -m "Change family pickup lead time to two hours"
          git push
