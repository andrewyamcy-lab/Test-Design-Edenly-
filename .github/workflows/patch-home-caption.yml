name: Patch home caption
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update caption
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('background:rgba(14,59,44,.72)', 'background:rgba(14,59,44,.65)')
          s = re.sub(
              r'<div class="cap"><strong data-zh="一杯 Gelato，一份每日的小確幸。" data-en="One cup of gelato, one little everyday joy\.">一杯 Gelato，一份每日的小確幸。</strong><span data-zh="小批量製作 · 口味輪流登場" data-en="Small-batch made · Rotating flavours">小批量製作 · 口味輪流登場</span></div>',
              '<div class="cap"><strong data-zh="一杯 Gelato，一份小確幸。" data-en="One cup of gelato, one little joy.">一杯 Gelato，一份小確幸。</strong></div>',
              s,
              count=1,
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Shorten home photo caption and increase transparency"
          git push
