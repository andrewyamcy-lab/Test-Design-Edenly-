name: Patch family flavours
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update family-size flavour choices
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit changes
        run: |
          if git diff --quiet -- family.html; then
            echo "No family.html changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html
          git commit -m "Update family-size flavours"
          git push
