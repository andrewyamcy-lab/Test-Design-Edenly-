name: Patch family flavours
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add seasonal family flavour
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('family.html')
          b=p.read_bytes()
          original=b
          if b'value="seasonal"' not in b:
              pat=rb'(<input class="choice-input flavour-check" type="checkbox" id="f7" value="tofu" disabled><label class="flavour-choice" for="f7">.*?</label>)'
              block='\n<input class="choice-input flavour-check" type="checkbox" id="f8" value="seasonal" disabled><label class="flavour-choice" for="f8"><strong data-zh="季節限定" data-en="Seasonal Special">季節限定</strong><small>Seasonal Special</small></label>'.encode('utf-8')
              b,n=re.subn(pat,lambda m:m.group(1)+block,b,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit('Could not find tofu flavour block')
          marker=b'};\nconst sizeRadios'
          start=b.find(b'const flavours={')
          end=b.find(marker,start)
          if start<0 or end<0:
              raise SystemExit('Could not find flavours object')
          obj=b[start:end]
          if b'seasonal:' not in obj:
              addition=",seasonal:{zh:'季節限定',en:'Seasonal Special'}".encode('utf-8')
              b=b[:end]+addition+b[end:]
          if b==original:
              print('No changes needed')
          else:
              p.write_bytes(b)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html
          git commit -m "Update family-size gelato flavours"
          git push
