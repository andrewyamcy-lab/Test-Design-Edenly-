name: Update custom domain URLs

on:
  push:
    paths:
      - '.github/workflows/update-custom-domain-urls.yml'

permissions:
  contents: write

jobs:
  update-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace old GitHub Pages URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          old = b'https://andrewyamcy-lab.github.io/Test-Design-Edenly-'
          new = b'https://edenlygelato.hk'
          files = [Path('index.html'), Path('family.html'), Path('sitemap.xml'), Path('robots.txt')]

          for path in files:
              data = path.read_bytes()
              count = data.count(old)
              if count:
                  path.write_bytes(data.replace(old, new))
                  print(f'{path}: replaced {count} occurrence(s)')
              else:
                  print(f'{path}: no old URL found')
          PY
      - name: Commit updated URLs
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html family.html sitemap.xml robots.txt
          git commit -m 'Update site URLs to edenlygelato.hk'
          git push
