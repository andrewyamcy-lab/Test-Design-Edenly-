name: Patch mobile navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile menu and sticky order CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          dec=lambda s: base64.b64decode(s)
          common_css=dec('')
          sticky_css=dec('')
          menu_js=dec('')
          sticky_js=dec('')
          toggle=dec('PGJ1dHRvbiBjbGFzcz0ibWVudS10b2dnbGUiIGlkPSJtZW51VG9nZ2xlIiB0eXBlPSJidXR0b24iIGFyaWEtbGFiZWw9Ik9wZW4gbmF2aWdhdGlvbiIgYXJpYS1leHBhbmRlZD0iZmFsc2UiIGFyaWEtY29udHJvbHM9Im1vYmlsZU1lbnUiPjxzcGFuPjwvc3Bhbj48c3Bhbj48L3NwYW4+PHNwYW4+PC9zcGFuPjwvYnV0dG9uPg==')
          home_menu=dec('')
          family_menu=dec('')
          sticky=dec('PGEgaWQ9InN0aWNreUZhbWlseUN0YSIgY2xhc3M9Im1vYmlsZS1mYW1pbHktc3RpY2t5IiBocmVmPSJmYW1pbHkuaHRtbD92PTIwMjYwOTEzLW1vYmlsZSIgZGF0YS16aD0i6KiC6LO85a625bqt6KOdIOKGkiIgZGF0YS1lbj0iT3JkZXIgRmFtaWx5IFNpemUg4oaSIj7oqILos7zlrrbluq3oo50g4oaSPC9hPg==')
          for filename,is_home in [('index.html',True),('family.html',False)]:
              p=Path(filename); b=p.read_bytes(); original=b
              if b'menu-toggle' in b: continue
              b=b.replace(b'</style>',common_css+(sticky_css if is_home else b'')+b'</style>',1)
              b=b.replace(b'<button id="e">EN</button></div><a class="pill"',b'<button id="e">EN</button></div>'+toggle+b'<a class="pill"',1)
              b=b.replace(b'</header>',b'</header>'+(home_menu if is_home else family_menu),1)
              if is_home:
                  b=b.replace(b'<script>function L',sticky+b'<script>function L',1)
                  b=b.replace(b'</script></body></html>',menu_js+sticky_js+b'</script></body></html>',1)
              else:
                  b=b.replace(b'</script>',menu_js+b'</script>',1)
              if b!=original: p.write_bytes(b)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html family.html
          git commit -m "Add mobile menu and sticky family order CTA"
          git push
