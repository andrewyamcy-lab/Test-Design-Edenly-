name: Add family quantity selector
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add quantity selector and quantity-aware total/order message
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('family.html')
          b=p.read_bytes()
          if b'/* family-quantity-selector */' in b:
              raise SystemExit('Quantity selector already present')
          css=base64.b64decode('')
          js=base64.b64decode('¯jOebku7bkuI3lkIzlj6PlkbPvvIzlj6/lnKggV2hhdHNBcHAg5YaN6Ki764us44CCPC9zbWFsbD48L2Rpdj48ZGl2IGNsYXNzPSJxdWFudGl0eS1zdGVwcGVyIiBhcmlhLWxhYmVsPSJRdWFudGl0eSI+PGJ1dHRvbiBpZD0icXR5TWludXMiIHR5cGU9ImJ1dHRvbiIgYXJpYS1sYWJlbD0iRGVjcmVhc2UgcXVhbnRpdHkiPuKI’¯ hLJC )<...TRUNCATED...')
          if b'</style>' not in b:
              raise SystemExit('Missing </style>')
          b=b.replace(b'</style>',css+b'</style>',1)
          if b'</body>' not in b:
              raise SystemExit('Missing </body>')
          b=b.replace(b'</body>',js+b'</body>',1)
          p.write_bytes(b)
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html
          git rm .github/workflows/add-family-quantity.yml
          git commit -m "Add quantity selector to family-size orders"
          git push
