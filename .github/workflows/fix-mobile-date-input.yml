name: Fix mobile date input
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize iPhone date input styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('family.html')
          b = p.read_bytes()
          marker = b'/* mobile-date-input-fix */'
          if marker in b:
              raise SystemExit('Date input fix already present')
          css = b'''\n/* mobile-date-input-fix */\n.field input[type="date"]{\n  -webkit-appearance:none;\n  appearance:none;\n  display:block;\n  width:100%;\n  min-width:0;\n  height:52px;\n  min-height:52px;\n  padding:0 14px;\n  border:1px solid var(--line);\n  border-radius:15px;\n  background:#fff;\n  color:var(--ink);\n  font:inherit;\n  font-size:16px;\n  line-height:1.2;\n  text-align:left;\n  box-sizing:border-box;\n}\n.field input[type="date"]::-webkit-date-and-time-value{\n  text-align:left;\n  margin:0;\n  min-height:0;\n}\n.field input[type="date"]::-webkit-datetime-edit{\n  padding:0;\n}\n.field input[type="date"]::-webkit-calendar-picker-indicator{\n  margin:0;\n  padding:0;\n  opacity:.62;\n}\n.field input[type="date"]:focus{\n  border-color:var(--g);\n  box-shadow:0 0 0 3px rgba(14,59,44,.08);\n  outline:none;\n}\n@media(max-width:620px){\n  .field input[type="date"]{\n    height:54px;\n    min-height:54px;\n    border-radius:15px;\n    padding:0 14px;\n    font-size:16px;\n  }\n}\n'''
          if b'</style>' not in b:
              raise SystemExit('Could not find </style>')
          b = b.replace(b'</style>', css + b'</style>', 1)
          p.write_bytes(b)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html
          git commit -m "Fix mobile date input styling"
          git push
