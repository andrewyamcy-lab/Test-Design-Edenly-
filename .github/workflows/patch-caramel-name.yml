name: Patch caramel name
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename caramel flavour
        run: |
          perl -0pi -e 's/Caramel Biscuit/Caramel Biscoff/g' family.html
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family.html
          git commit -m "Rename Caramel Biscuit to Caramel Biscoff"
          git push
